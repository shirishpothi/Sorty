name: Nightly Update

on:
  workflow_dispatch: {}

concurrency:
  group: sparkle-publishing
  cancel-in-progress: false

env:
  NIGHTLY_TAG: nightly
  NIGHTLY_ZIP: Sorty-nightly.zip
  NIGHTLY_APPCAST: appcast-nightly.xml
  NIGHTLY_APPCAST_URL: https://github.com/sorty-organizer/Sorty/releases/download/nightly/appcast-nightly.xml
  RELEASE_NOTES_HTML: release-notes.html
  MINIMUM_PUBLISHED_BUILD: '202607091757'

jobs:
  nightly:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compute toolchain cache key
        id: toolchain
        run: |
          TOOLCHAIN_KEY=$({ xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "key=${TOOLCHAIN_KEY}" >> "$GITHUB_OUTPUT"

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-nightly-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-nightly-
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-

      - name: Prepare nightly metadata
        id: nightly
        run: |
          LATEST_STABLE_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -n "$LATEST_STABLE_TAG" ]; then
            BASE_VERSION="${LATEST_STABLE_TAG#v}"
          else
            BASE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          fi
          NIGHTLY_STAMP=$(date -u +%Y%m%d%H%M%S)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_NUM="${NIGHTLY_STAMP}"
          DISPLAY_NAME="Sorty ${BASE_VERSION} Nightly Preview"
          BUILD_LABEL="nightly.${NIGHTLY_STAMP}.${SHORT_SHA}"
          {
            echo "base_version=${BASE_VERSION}"
            echo "build_num=${BUILD_NUM}"
            echo "display_name=${DISPLAY_NAME}"
            echo "build_label=${BUILD_LABEL}"
            echo "short_sha=${SHORT_SHA}"
            echo "latest_stable_tag=${LATEST_STABLE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          SORTY_BUILD_DIR: ${{ github.workspace }}/.build
        run: |
          chmod +x ./scripts/build.sh
          BUILD_METHOD=xcodebuild \
          SKIP_TESTS=true \
          BUILD_ARCHS="arm64 x86_64" \
          BUILD_TAIL_LINES=400 \
          APP_ICON_VARIANT=nightly \
          XCODE_EXTRA_FLAGS="COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf ENABLE_CODE_COVERAGE=NO" \
          ./scripts/build.sh

      - name: Upload nightly build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-logs
          path: .build/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stamp nightly update feed
        run: |
          PLIST="releases/Sorty.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.nightly.outputs.build_num }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.nightly.outputs.base_version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string ${{ env.NIGHTLY_APPCAST_URL }}" "$PLIST"
          codesign --force --options runtime --sign - --entitlements Sorty.entitlements "releases/Sorty.app"

      - name: Package nightly ZIP
        run: |
          chmod +x ./scripts/package.sh
          ZIP_NAME_OVERRIDE="${{ env.NIGHTLY_ZIP }}" ./scripts/package.sh

      - name: Write formatted release notes
        run: |
          python3 scripts/generate_sparkle_release_notes.py \
            --title "${{ steps.nightly.outputs.display_name }}" \
            --summary "This automated preview contains the latest changes from main. Build: ${{ steps.nightly.outputs.build_label }}." \
            --markdown nightly-release-notes.md \
            --html "releases/${{ env.RELEASE_NOTES_HTML }}" \
            --from-tag "${{ steps.nightly.outputs.latest_stable_tag }}"

      - name: Generate nightly appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPCAST_REPOSITORY: ${{ github.repository }}
          APPCAST_RELEASE_TAG: ${{ env.NIGHTLY_TAG }}
          APPCAST_FILE_OVERRIDE: releases/${{ env.NIGHTLY_APPCAST }}
          APPCAST_VERSION: ${{ steps.nightly.outputs.base_version }}
          APPCAST_BUILD_NUM: ${{ steps.nightly.outputs.build_num }}
          APPCAST_ITEM_TITLE: ${{ steps.nightly.outputs.display_name }}
          APPCAST_CHANNEL: nightly
          APPCAST_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.NIGHTLY_TAG }}/${{ env.RELEASE_NOTES_HTML }}
        run: |
          chmod +x ./scripts/generate_appcast_ci.sh
          ZIP_NAME_OVERRIDE="${{ env.NIGHTLY_ZIP }}" ./scripts/generate_appcast_ci.sh

      - name: Validate nightly appcast
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh \
            --appcast "releases/${{ env.NIGHTLY_APPCAST }}" \
            --plist "releases/Sorty.app/Contents/Info.plist" \
            --minimum-build "${{ env.MINIMUM_PUBLISHED_BUILD }}" \
            --expected-version "${{ steps.nightly.outputs.base_version }}" \
            --expected-channel nightly \
            --expected-release-tag "${{ env.NIGHTLY_TAG }}"

      - name: Publish moving nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f "${{ env.NIGHTLY_TAG }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ env.NIGHTLY_TAG }}" --force

          if gh release view "${{ env.NIGHTLY_TAG }}" >/dev/null 2>&1; then
            gh release edit "${{ env.NIGHTLY_TAG }}" \
              --title "${{ steps.nightly.outputs.display_name }}" \
              --notes-file nightly-release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          else
            gh release create "${{ env.NIGHTLY_TAG }}" \
              --title "${{ steps.nightly.outputs.display_name }}" \
              --notes-file nightly-release-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release upload "${{ env.NIGHTLY_TAG }}" \
            "releases/${{ env.NIGHTLY_ZIP }}" \
            "releases/${{ env.NIGHTLY_APPCAST }}" \
            "releases/${{ env.RELEASE_NOTES_HTML }}" \
            --clobber

      - name: Summary
        run: |
          echo "## Nightly Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.nightly.outputs.display_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build label: ${{ steps.nightly.outputs.build_label }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notes baseline: ${{ steps.nightly.outputs.latest_stable_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.nightly.outputs.build_num }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: ${{ env.NIGHTLY_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Appcast: ${{ env.NIGHTLY_APPCAST }}" >> "$GITHUB_STEP_SUMMARY"
