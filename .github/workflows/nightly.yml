name: Nightly Update

on:
  schedule:
    # Midnight Singapore time.
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-update
  cancel-in-progress: true

env:
  PROJECT_NAME: Sorty
  NIGHTLY_TAG: nightly
  NIGHTLY_ZIP: Sorty-nightly.zip
  NIGHTLY_APPCAST: appcast-nightly.xml
  STABLE_PROMOTION_APPCAST: appcast.xml

jobs:
  nightly:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-nightly-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-nightly-
            ${{ runner.os }}-spm-

      - name: Prepare nightly metadata
        id: nightly
        run: |
          BASE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          NIGHTLY_STAMP=$(date -u +%Y%m%d%H%M)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_NUM="${NIGHTLY_STAMP}"
          DISPLAY_VERSION="${BASE_VERSION}-nightly.${NIGHTLY_STAMP}.${SHORT_SHA}"

          {
            echo "base_version=${BASE_VERSION}"
            echo "build_num=${BUILD_NUM}"
            echo "display_version=${DISPLAY_VERSION}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: |
          chmod +x ./scripts/build.sh
          BUILD_METHOD=xcodebuild \
          SKIP_TESTS=true \
          BUILD_ARCHS="arm64 x86_64" \
          BUILD_TAIL_LINES=400 \
          APP_ICON_VARIANT=release \
          XCODE_EXTRA_FLAGS="COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf ENABLE_CODE_COVERAGE=NO" \
          ./scripts/build.sh

      - name: Upload nightly build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-build-logs
          path: .build/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stamp nightly update feed
        run: |
          PLIST="releases/Sorty.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.nightly.outputs.build_num }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.nightly.outputs.base_version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string https://github.com/${{ github.repository }}/releases/download/${{ env.NIGHTLY_TAG }}/${{ env.NIGHTLY_APPCAST }}" "$PLIST"
          codesign --force --deep --sign - "releases/Sorty.app"

      - name: Package nightly ZIP
        run: |
          chmod +x ./scripts/package.sh
          ZIP_NAME_OVERRIDE="${{ env.NIGHTLY_ZIP }}" ./scripts/package.sh

      - name: Generate nightly appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPCAST_REPOSITORY: ${{ github.repository }}
          APPCAST_RELEASE_TAG: ${{ env.NIGHTLY_TAG }}
          APPCAST_FILE_OVERRIDE: releases/${{ env.NIGHTLY_APPCAST }}
          APPCAST_VERSION: ${{ steps.nightly.outputs.base_version }}
          APPCAST_BUILD_NUM: ${{ steps.nightly.outputs.build_num }}
          APPCAST_ITEM_TITLE: Nightly ${{ steps.nightly.outputs.display_version }}
          APPCAST_CHANNEL: nightly
          APPCAST_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          chmod +x ./scripts/generate_appcast_ci.sh
          ZIP_NAME_OVERRIDE="${{ env.NIGHTLY_ZIP }}" ./scripts/generate_appcast_ci.sh

      - name: Generate stable-channel promotion appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPCAST_REPOSITORY: ${{ github.repository }}
          APPCAST_RELEASE_TAG: ${{ env.NIGHTLY_TAG }}
          APPCAST_FILE_OVERRIDE: releases/${{ env.STABLE_PROMOTION_APPCAST }}
          APPCAST_VERSION: ${{ steps.nightly.outputs.base_version }}
          APPCAST_BUILD_NUM: ${{ steps.nightly.outputs.build_num }}
          APPCAST_ITEM_TITLE: Sorty ${{ steps.nightly.outputs.base_version }} Nightly Preview
          APPCAST_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.NIGHTLY_TAG }}
        run: |
          ZIP_NAME_OVERRIDE="${{ env.NIGHTLY_ZIP }}" ./scripts/generate_appcast_ci.sh

      - name: Validate nightly appcast
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh \
            --appcast "releases/${{ env.NIGHTLY_APPCAST }}" \
            --plist "releases/Sorty.app/Contents/Info.plist"

      - name: Validate stable-channel promotion appcast
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh \
            --appcast "releases/${{ env.STABLE_PROMOTION_APPCAST }}" \
            --plist "releases/Sorty.app/Contents/Info.plist"

      - name: Write nightly release notes
        run: |
          PREVIOUS_NIGHTLY=$(git rev-list -n 1 "${{ env.NIGHTLY_TAG }}" 2>/dev/null || true)
          if [ -n "$PREVIOUS_NIGHTLY" ]; then
            RANGE="${PREVIOUS_NIGHTLY}..HEAD"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREVIOUS_NIGHTLY}...${GITHUB_SHA}"
          else
            RANGE="HEAD~25..HEAD"
            COMPARE_URL="https://github.com/${{ github.repository }}/commit/${GITHUB_SHA}"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges 2>/dev/null || true)
          if [ -z "$COMMITS" ]; then
            COMMITS="- No user-facing commits since the previous nightly."
          fi

          cat > nightly-release-notes.md <<EOF
          ## Sorty Nightly ${{ steps.nightly.outputs.display_version }}

          Built from \`${GITHUB_SHA}\` on \`main\`.

          ### What changed
          ${COMMITS}

          ### Update channel
          This first nightly preview is also published through the normal stable update feed so everyone on Sorty 1.1.2 can choose to install it.

          After installing, Sorty stays on the regular release update system unless you turn on **Settings > Experimental > Nightly Updates**.

          Future nightly-only builds use this Sparkle feed:

          \`https://github.com/${{ github.repository }}/releases/download/${{ env.NIGHTLY_TAG }}/${{ env.NIGHTLY_APPCAST }}\`

          ### Notes
          This build is intentionally more fragile than a normal stable release because it introduces the new design system and nightly access path.

          ${COMPARE_URL}
          EOF

      - name: Publish moving nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.NIGHTLY_TAG }}" --yes --cleanup-tag 2>/dev/null || true
          git tag -f "${{ env.NIGHTLY_TAG }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ env.NIGHTLY_TAG }}" --force
          gh release create "${{ env.NIGHTLY_TAG }}" \
            --title "Sorty Nightly ${{ steps.nightly.outputs.display_version }}" \
            --notes-file nightly-release-notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
          gh release upload "${{ env.NIGHTLY_TAG }}" \
            "releases/${{ env.NIGHTLY_ZIP }}" \
            "releases/${{ env.NIGHTLY_APPCAST }}" \
            "releases/${{ env.STABLE_PROMOTION_APPCAST }}" \
            --clobber

      - name: Promote first nightly to stable appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_STABLE=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$LATEST_STABLE" ]; then
            echo "No stable release found for appcast promotion"
            exit 1
          fi

          echo "Publishing first nightly preview to stable appcast on ${LATEST_STABLE}"
          gh release delete-asset "$LATEST_STABLE" "${{ env.STABLE_PROMOTION_APPCAST }}" --yes 2>/dev/null || true
          gh release upload "$LATEST_STABLE" "releases/${{ env.STABLE_PROMOTION_APPCAST }}" --clobber

      - name: Summary
        run: |
          echo "## Nightly Update Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.nightly.outputs.display_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.nightly.outputs.build_num }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: ${{ env.NIGHTLY_TAG }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Appcast: ${{ env.NIGHTLY_APPCAST }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable promotion appcast: ${{ env.STABLE_PROMOTION_APPCAST }}" >> "$GITHUB_STEP_SUMMARY"
