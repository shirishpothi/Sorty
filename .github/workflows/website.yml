name: Website (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /Sorty
        run: pnpm build

      - name: Inject PostHog source-map identifiers
        working-directory: website
        run: >-
          pnpm exec posthog-cli sourcemap inject
          --directory out/_next/static
          --release-name sorty-website
          --release-version "${GITHUB_SHA}"

      - name: Upload PostHog source maps
        working-directory: website
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
        run: |
          if [[ -z "${POSTHOG_CLI_API_KEY}" || -z "${POSTHOG_CLI_PROJECT_ID}" ]]; then
            echo "PostHog CLI credentials are unavailable; skipping source-map upload."
            find out/_next/static -type f -name '*.map' -delete
            exit 0
          fi

          pnpm exec posthog-cli sourcemap upload \
            --directory out/_next/static \
            --release-name sorty-website \
            --release-version "${GITHUB_SHA}" \
            --delete-after

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
