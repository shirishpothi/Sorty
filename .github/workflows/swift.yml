name: Swift CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test Scope'
        required: true
        default: 'Unit'
        type: choice
        options:
        - Unit
        - CLI
        - None
      release_type:
        description: 'Release Type'
        required: true
        default: 'None'
        type: choice
        options:
        - None
        - Beta
        - Production

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast security check - runs on ubuntu (faster startup)
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Main build and test job
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      # Cache SPM dependencies
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Show environment info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run Unit Tests (SPM)
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee unit_test_output.log
          echo "✅ Unit tests completed"


      - name: Build the app (via script)
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          echo "✅ Build script succeeded"

      - name: Generate Appcast
        if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'None'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is required for appcast generation"
            exit 1
          fi
          chmod +x ./scripts/generate_appcast_ci.sh
          ./scripts/generate_appcast_ci.sh

      - name: Validate Sparkle Update System
        if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'None'
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh

      - name: Pre-release validation
        run: |
          chmod +x scripts/prerelease_check.sh
          ./scripts/prerelease_check.sh --skip-build --skip-tests --skip-sparkle

      - name: Run Build and Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          ARGS=""
          
          # correct scope mapping
          if [[ "${{ inputs.test_scope }}" == "CLI" ]]; then
             ARGS="$ARGS --cli-only"
          elif [[ "${{ inputs.test_scope }}" == "None" ]]; then
             ARGS="$ARGS --no-tests"
          else
             # Default or Unit (UI tests are globally disabled in CI)
             ARGS="$ARGS --skip-ui"
          fi
          
          echo "Running release.sh with args: $ARGS"
          ./scripts/release.sh $ARGS
        env:
           NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
           NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
           TEAM_ID: ${{ secrets.TEAM_ID }}

      - name: Archive Release Artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.release_type != 'None'
        uses: actions/upload-artifact@v4
        with:
          name: Release-Artifacts
          path: releases/

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            unit_test_output.log
            build_output.log
            ui_test_output.log
            cli_build_output.log
            TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
