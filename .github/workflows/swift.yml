name: Swift CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test Scope'
        required: true
        default: 'Unit'
        type: choice
        options:
        - Unit
        - CLI
        - None
      release_type:
        description: 'Release Type'
        required: true
        default: 'None'
        type: choice
        options:
        - None
        - Beta
        - Production

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast security check - runs on ubuntu (faster startup)
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Check if local CI already passed for this commit
  check-local-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for local-ci status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          STATUS=$(gh api "/repos/${{ github.repository }}/commits/${SHA}/statuses" \
            --jq '[.[] | select(.context == "local-ci" and .state == "success")] | length' \
            2>/dev/null || echo "0")
          if [ "$STATUS" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ Local CI already passed for ${SHA:0:7} — skipping redundant checks"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No local CI status found — running full CI"
          fi

  # Main build and test job
  build-and-test:
    needs: check-local-ci
    if: ${{ needs.check-local-ci.outputs.skip != 'true' }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # Cache SPM dependencies
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & Test (SPM)
        run: |
          set -o pipefail
          CORES=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          # Build all products first so SortyApp + LearningsCLI are also validated
          swift build --disable-sandbox -j "$CORES"
          swift test --disable-sandbox --parallel -j "$CORES" 2>&1 | tee unit_test_output.log
          echo "✅ Build & tests completed"

      - name: Build app via script
        env:
          SKIP_TESTS: "true"
          SKIP_GIT_INJECT: "true"
          BUILD_CONFIG: "debug"
          APP_ICON_VARIANT: "ci"
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          echo "✅ Build script succeeded"

      - name: Generate Appcast
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type != 'None' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is required for appcast generation"
            exit 1
          fi
          chmod +x ./scripts/generate_appcast_ci.sh
          ./scripts/generate_appcast_ci.sh

      - name: Validate Sparkle Update System
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type != 'None' }}
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh

      - name: Pre-release validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x scripts/prerelease_check.sh
          ./scripts/prerelease_check.sh --skip-build --skip-tests --skip-sparkle

      - name: Run Build and Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          ARGS=""
          
          # correct scope mapping
          if [[ "${{ inputs.test_scope }}" == "CLI" ]]; then
             ARGS="$ARGS --cli-only"
          elif [[ "${{ inputs.test_scope }}" == "None" ]]; then
             ARGS="$ARGS --no-tests"
          else
             # Default or Unit (UI tests are globally disabled in CI)
             ARGS="$ARGS --skip-ui"
          fi
          
          echo "Running release.sh with args: $ARGS"
          ./scripts/release.sh $ARGS

      - name: Archive Release Artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type != 'None' }}
        uses: actions/upload-artifact@v4
        with:
          name: Release-Artifacts
          path: releases/

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            unit_test_output.log
            build_output.log
          retention-days: 7
          if-no-files-found: ignore
