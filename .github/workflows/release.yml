name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0 or 0.5.0-beta-1)'
        required: true
        type: string

env:
  PROJECT_NAME: Sorty
  SCHEME: Sorty

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
      security-events: write

    steps:
      # ===========================================
      # 1. Checkout
      # ===========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===========================================
      # CodeQL analysis
      # ===========================================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: 'swift'

      - name: Build for CodeQL
        run: |
          swift build -c release --build-path .build 2>&1 | head -100

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      # ===========================================
      # 2. Setup Xcode
      # ===========================================
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0' # Adjust as needed for the project

      # ===========================================
      # 2b. Run Unit Tests
      # ===========================================
      - name: Run Unit Tests
        run: |
          swift test --parallel 2>&1 | tail -100

      # ===========================================
      # 3. Extract version from tag or input
      # ===========================================
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          # Check if beta
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Releasing version: ${VERSION}"
      # ===========================================
      # 4. Update CHANGELOG if needed
      # ===========================================
      - name: Update CHANGELOG
        run: |
          chmod +x ./scripts/update-changelog.sh
          ./scripts/update-changelog.sh "${{ steps.version.outputs.VERSION }}"
      # ===========================================
      # 5. Bump version in Xcode project
      # ===========================================
      - name: Bump version
        run: |
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ steps.version.outputs.VERSION }}"
      # ===========================================
      # 6. Build
      # ===========================================
      - name: Build
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh
      # ===========================================
      # 7. Package (ZIP + DMG)
      # ===========================================
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh

      - name: Verify Notarization Stapling
        run: |
          if xcrun stapler validate "releases/${{ env.PROJECT_NAME }}.dmg"; then
            echo "Stapling verified successfully"
          else
            echo "Warning: Stapling validation failed or was skipped (ad-hoc signing)"
          fi

      # ===========================================
      # 8. Generate Appcast with Sparkle signing
      # ===========================================
      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x ./scripts/generate-appcast-ci.sh
          ./scripts/generate-appcast-ci.sh
      # ===========================================
      # 9. Create tag (for workflow_dispatch)
      # ===========================================
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="v${{ steps.version.outputs.VERSION }}"
          if ! git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -a "${TAG_NAME}" -m "Release ${{ steps.version.outputs.VERSION }}"
            git push origin "${TAG_NAME}"
          fi
      # ===========================================
      # 10. Create GitHub Release
      # ===========================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.version.outputs.VERSION }}
          files: |
            releases/*.dmg
            releases/*.zip
            releases/appcast.xml
          generate_release_notes: true
          append_body: true
          body: |
            
            ## Installation
            Download `Sorty-${{ steps.version.outputs.VERSION }}.dmg` or `Sorty-${{ steps.version.outputs.VERSION }}.zip` below.
            > ⚠️ **Note**: The app is not signed with an Apple Developer certificate. If macOS blocks the app, run:
            > ```bash
            > xattr -cr /Applications/Sorty.app
            > ```
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}

      # ===========================================
      # 11. Update latest stable release with merged appcast
      # ===========================================
      - name: Update latest stable appcast
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest stable release tag
          LATEST_STABLE=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          
          if [ -n "$LATEST_STABLE" ]; then
            echo "Updating appcast on latest stable release: $LATEST_STABLE"
            
            # Delete old appcast from stable release
            gh release delete-asset "$LATEST_STABLE" appcast.xml --yes 2>/dev/null || true
            
            # Upload merged appcast to stable release
            gh release upload "$LATEST_STABLE" releases/appcast.xml --clobber
            
            echo "Updated appcast.xml on $LATEST_STABLE with merged entries"
          else
            echo "No stable release found to update"
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet CHANGELOG.md FileOrganiser.xcodeproj/project.pbxproj Info.plist; then
            echo "No changes to commit"
          else
            git add CHANGELOG.md FileOrganiser.xcodeproj/project.pbxproj Info.plist
            git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"
            git push origin HEAD:main
          fi
      # ===========================================
      # 12. Summary
      # ===========================================
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: ${{ steps.version.outputs.IS_PRERELEASE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls -la releases/ >> $GITHUB_STEP_SUMMARY
