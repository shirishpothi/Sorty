name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0 or 0.5.0-beta-1)'
        required: true
        type: string

env:
  PROJECT_NAME: Sorty
  SCHEME: Sorty

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      # ===========================================
      # 1. Checkout
      # ===========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===========================================
      # 2. Setup Xcode
      # ===========================================
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable' # Use latest stable Xcode for SDK compatibility

      # ===========================================
      # 2b. Run Unit Tests
      # ===========================================
      - name: Run Unit Tests
        run: |
          swift test --parallel 2>&1 | tail -100

      # ===========================================
      # 3. Extract version from tag or input
      # ===========================================
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          # Check if beta
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Releasing version: ${VERSION}"
      # ===========================================
      # 4. Build
      # ===========================================
      - name: Build
        run: |
          chmod +x ./scripts/build.sh
          # Use xcodebuild for CI releases - ensures proper SDK targeting
          # Versioning is handled automatically via git tags in build.sh
          BUILD_METHOD=xcodebuild SKIP_TESTS=true ./scripts/build.sh
      # ===========================================
      # 5. Package (ZIP)
      # ===========================================
      - name: Package
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh


      # ===========================================
      # 8. Generate Appcast with Sparkle signing
      # ===========================================
      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x ./scripts/generate_appcast_ci.sh
          ./scripts/generate_appcast_ci.sh

      # ===========================================
      # 8b. Validate Sparkle Update System
      # ===========================================
      - name: Validate Sparkle Update System
        run: |
          echo "Validating Sparkle update system..."
          ERRORS=0
          
          # 1. Check appcast.xml exists and is valid XML
          APPCAST="releases/appcast.xml"
          if [ ! -f "$APPCAST" ]; then
            echo "::error::appcast.xml not found in releases/"
            ERRORS=$((ERRORS + 1))
          else
            # Validate XML structure
            if ! xmllint --noout "$APPCAST" 2>/dev/null; then
              echo "::error::appcast.xml is not valid XML"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Check required Sparkle elements
            if ! grep -q 'sparkle:version=' "$APPCAST"; then
              echo "::error::appcast.xml missing sparkle:version attribute"
              ERRORS=$((ERRORS + 1))
            fi
            if ! grep -q 'sparkle:shortVersionString=' "$APPCAST"; then
              echo "::error::appcast.xml missing sparkle:shortVersionString attribute"
              ERRORS=$((ERRORS + 1))
            fi
            if ! grep -q '<enclosure' "$APPCAST"; then
              echo "::error::appcast.xml missing enclosure element"
              ERRORS=$((ERRORS + 1))
            fi
            
            # Verify Ed25519 signature is present in the appcast
            # (signature should have been generated if SPARKLE_PRIVATE_KEY was set during appcast generation)
            if grep -q 'sparkle:edSignature=' "$APPCAST"; then
              echo "✓ Appcast is signed with Ed25519"
            else
              echo "::warning::Appcast has no Ed25519 signature - ensure SPARKLE_PRIVATE_KEY secret is configured"
            fi
          fi
          
          # 2. Validate Info.plist Sparkle configuration (without logging sensitive values)
          PLIST="Info.plist"
          FEED_URL=$(/usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$PLIST" 2>/dev/null || echo "")
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$PLIST" 2>/dev/null || echo "")
          
          if [ -z "$FEED_URL" ]; then
            echo "::error::SUFeedURL not set in Info.plist"
            ERRORS=$((ERRORS + 1))
          elif [[ ! "$FEED_URL" == *"appcast.xml"* ]]; then
            echo "::error::SUFeedURL does not point to an appcast.xml file"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ SUFeedURL configured correctly"
          fi
          
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::SUPublicEDKey not set in Info.plist"
            ERRORS=$((ERRORS + 1))
          elif [ ${#PUBLIC_KEY} -lt 40 ]; then
            echo "::error::SUPublicEDKey appears invalid (key too short)"
            ERRORS=$((ERRORS + 1))
          else
            echo "✓ SUPublicEDKey configured"
          fi
          
          # 3. Verify download URL in appcast matches expected pattern
          if [ -f "$APPCAST" ]; then
            DOWNLOAD_URL=$(grep -o 'url="[^"]*"' "$APPCAST" | head -1 | sed 's/url="//;s/"$//')
            if [[ ! "$DOWNLOAD_URL" == *"github.com"*"releases"*"Sorty.pkg"* ]]; then
              echo "::error::Download URL in appcast doesn't match expected GitHub releases pattern: $DOWNLOAD_URL"
              ERRORS=$((ERRORS + 1))
            else
              echo "✓ Download URL valid: $DOWNLOAD_URL"
            fi
          fi
          
          # Summary
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "::error::Sparkle update system validation failed with $ERRORS error(s)"
            exit 1
          fi
          
          echo ""
          echo "✓ Sparkle update system validated successfully"

      # ===========================================
      # 9. Create tag (for workflow_dispatch)
      # ===========================================
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="v${{ steps.version.outputs.VERSION }}"
          if ! git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -a "${TAG_NAME}" -m "Release ${{ steps.version.outputs.VERSION }}"
            git push origin "${TAG_NAME}"
          fi
      # ===========================================
      # 10. Create GitHub Release
      # ===========================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.version.outputs.VERSION }}
          files: |
            releases/Sorty.pkg
            releases/appcast.xml
          generate_release_notes: true
          append_body: true
          body: |
            
            ## Installation
            Download `Sorty.pkg` below.
            > ⚠️ **Note**: The app is not signed with an Apple Developer certificate. If macOS blocks the app, run:
            > ```bash
            > xattr -cr /Applications/Sorty.app
            > ```

            ## CLI Tools
            Sorty bundles CLI tools inside the app. Install them from **Settings → Finder Integration → Command Line Tools**.
            
            ## Additional Downloads
            - **Sorty-Source.zip** - Full source code
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}

      # ===========================================
      # 11. Update latest stable release with merged appcast
      # ===========================================
      - name: Update latest stable appcast
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest stable release tag
          LATEST_STABLE=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          
          if [ -n "$LATEST_STABLE" ]; then
            echo "Updating appcast on latest stable release: $LATEST_STABLE"
            
            # Delete old appcast from stable release
            gh release delete-asset "$LATEST_STABLE" appcast.xml --yes 2>/dev/null || true
            
            # Upload merged appcast to stable release
            gh release upload "$LATEST_STABLE" releases/appcast.xml --clobber
            
            echo "Updated appcast.xml on $LATEST_STABLE with merged entries"
          else
            echo "No stable release found to update"
          fi
      # ===========================================
      # 12. Summary
      # ===========================================
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: ${{ steps.version.outputs.IS_PRERELEASE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls -la releases/ >> $GITHUB_STEP_SUMMARY
