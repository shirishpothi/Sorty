name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0 or 0.5.0-beta-1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: Sorty
  SCHEME: Sorty

jobs:
  prepare-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Releasing version: ${VERSION}"

      - name: Update Changelog
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "Version ${VERSION} already exists in CHANGELOG.md, skipping"
            exit 0
          fi

          CURRENT_TAG="v${VERSION}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | while read -r t; do
            if [ "$t" != "$CURRENT_TAG" ]; then
              echo "$t"
              break
            fi
          done)

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          fi

          if [ -z "$COMMITS" ]; then
            echo "No commits found, skipping changelog update"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          ADDED=""
          CHANGED=""
          FIXED=""
          REMOVED=""
          OTHER=""

          while IFS= read -r msg; do
            msg=$(echo "$msg" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$msg" ] && continue

            lower=$(echo "$msg" | tr '[:upper:]' '[:lower:]')
            body=$(echo "$msg" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?:[[:space:]]*//')

            case "$lower" in
              feat*) ADDED="${ADDED}- ${body}"$'\n' ;;
              fix*) FIXED="${FIXED}- ${body}"$'\n' ;;
              refactor*|perf*|style*) CHANGED="${CHANGED}- ${body}"$'\n' ;;
              revert*) REMOVED="${REMOVED}- ${body}"$'\n' ;;
              docs*|test*|build*|ci*|chore*) OTHER="${OTHER}- ${body}"$'\n' ;;
              *) OTHER="${OTHER}- ${msg}"$'\n' ;;
            esac
          done <<< "$COMMITS"

          ENTRY_FILE=$(mktemp)
          echo "## [${VERSION}] - ${DATE}" >> "$ENTRY_FILE"
          echo "" >> "$ENTRY_FILE"

          if [ -n "$ADDED" ]; then
            echo "### Added" >> "$ENTRY_FILE"
            echo "$ADDED" >> "$ENTRY_FILE"
          fi
          if [ -n "$CHANGED" ]; then
            echo "### Changed" >> "$ENTRY_FILE"
            echo "$CHANGED" >> "$ENTRY_FILE"
          fi
          if [ -n "$FIXED" ]; then
            echo "### Fixed" >> "$ENTRY_FILE"
            echo "$FIXED" >> "$ENTRY_FILE"
          fi
          if [ -n "$REMOVED" ]; then
            echo "### Removed" >> "$ENTRY_FILE"
            echo "$REMOVED" >> "$ENTRY_FILE"
          fi
          if [ -n "$OTHER" ]; then
            echo "### Other" >> "$ENTRY_FILE"
            echo "$OTHER" >> "$ENTRY_FILE"
          fi

          if [ -z "$ADDED" ] && [ -z "$CHANGED" ] && [ -z "$FIXED" ] && [ -z "$REMOVED" ] && [ -z "$OTHER" ]; then
            echo "### Changes" >> "$ENTRY_FILE"
            echo "$COMMITS" | while IFS= read -r line; do
              echo "- ${line}" >> "$ENTRY_FILE"
            done
            echo "" >> "$ENTRY_FILE"
          fi

          INSERT_LINE=$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -n "$INSERT_LINE" ]; then
            {
              head -n $((INSERT_LINE - 1)) CHANGELOG.md
              cat "$ENTRY_FILE"
              tail -n +${INSERT_LINE} CHANGELOG.md
            } > CHANGELOG.tmp
          else
            {
              cat CHANGELOG.md
              echo ""
              cat "$ENTRY_FILE"
            } > CHANGELOG.tmp
          fi

          mv CHANGELOG.tmp CHANGELOG.md
          rm -f "$ENTRY_FILE"
          echo "Changelog updated for version ${VERSION}"

      - name: Commit Changelog
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore: update changelog for v${{ steps.version.outputs.VERSION }}"
            git push origin HEAD:main
          fi

  unit-tests:
    runs-on: blacksmith-6vcpu-macos-15
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-tests-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-tests-
            ${{ runner.os }}-spm-

      - name: Run Unit Tests
        run: |
          set -o pipefail
          CORES=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          swift build --disable-sandbox -j "$CORES"
          swift test --disable-sandbox --parallel --skip-build -j "$CORES" 2>&1 | tail -100

  build-universal:
    runs-on: blacksmith-6vcpu-macos-15
    needs:
      - prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-universal-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-universal-
            ${{ runner.os }}-spm-

      - name: Build universal app
        run: |
          chmod +x ./scripts/build.sh
          BUILD_METHOD=xcodebuild \
          SKIP_TESTS=true \
          BUILD_ARCHS="arm64 x86_64" \
          APP_ICON_VARIANT=release \
          XCODE_EXTRA_FLAGS="COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf ENABLE_CODE_COVERAGE=NO" \
          ./scripts/build.sh

      - name: Package universal ZIP
        run: |
          chmod +x ./scripts/package.sh
          ZIP_NAME_OVERRIDE="Sorty-universal.zip" ./scripts/package.sh

      - name: Stage build artifacts
        run: |
          mkdir -p release-artifacts
          cp -R "releases/Sorty.app" "release-artifacts/Sorty.app"
          cp "releases/Sorty-universal.zip" "release-artifacts/"
          cp ".build/build_output.log" "release-artifacts/build_output_universal.log" 2>/dev/null || true

          # Preserve Sparkle's sign_update so release can sign appcast.xml.
          if [ -x ".build/artifacts/sparkle/Sparkle/bin/sign_update" ]; then
            mkdir -p "release-artifacts/sparkle-tools"
            cp ".build/artifacts/sparkle/Sparkle/bin/sign_update" \
               "release-artifacts/sparkle-tools/sign_update"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-universal
          path: release-artifacts/
          retention-days: 7

  release:
    runs-on: blacksmith-6vcpu-macos-15
    needs:
      - prepare-release
      - unit-tests
      - build-universal
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download universal artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-universal
          path: artifacts/universal

      - name: Prepare universal release assets
        run: |
          mkdir -p releases
          cp -R artifacts/universal/Sorty.app releases/
          cp artifacts/universal/Sorty-universal.zip releases/

          if [ -f "artifacts/universal/sparkle-tools/sign_update" ]; then
            mkdir -p ".build/artifacts/sparkle/Sparkle/bin"
            cp "artifacts/universal/sparkle-tools/sign_update" \
               ".build/artifacts/sparkle/Sparkle/bin/sign_update"
            chmod +x ".build/artifacts/sparkle/Sparkle/bin/sign_update"
          fi

      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x ./scripts/generate_appcast_ci.sh
          ZIP_NAME_OVERRIDE="Sorty-universal.zip" ./scripts/generate_appcast_ci.sh

      - name: Validate Sparkle Update System
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="v${{ needs.prepare-release.outputs.version }}"
          if ! git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -a "${TAG_NAME}" -m "Release ${{ needs.prepare-release.outputs.version }}"
            git push origin "${TAG_NAME}"
          fi

      - name: Extract changelog for release body
        id: changelog
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          CHANGELOG_CONTENT=$(awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {in_section=1; next}
            in_section && $0 ~ "^## \\[" {exit}
            in_section {print}
          ' CHANGELOG.md)

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="- No changelog entry found for v${VERSION}."
          fi

          {
            echo "release_changelog<<EOF"
            echo "$CHANGELOG_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: ${{ env.PROJECT_NAME }} ${{ needs.prepare-release.outputs.version }}
          files: |
            releases/Sorty-universal.zip
            releases/appcast.xml
          generate_release_notes: true
          append_body: true
          body: |
            ## Installation
            Download `Sorty-universal.zip` and move `Sorty.app` to `/Applications`.
            > ⚠️ **Note**: The app is not signed with an Apple Developer certificate. If macOS blocks the app, run:
            > ```bash
            > xattr -cr /Applications/Sorty.app
            > ```

            ## CLI Tools
            Sorty bundles CLI tools inside the app. Install them from **Settings → Finder Integration → Command Line Tools**.

            ## Additional Downloads
            - **Sorty-universal.zip** - Universal build (Apple Silicon + Intel)
            - **Sorty-Source.zip** - Full source code

            ## Changelog (v${{ needs.prepare-release.outputs.version }})
            ${{ steps.changelog.outputs.release_changelog }}
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}

      - name: Update latest stable appcast
        if: needs.prepare-release.outputs.is_prerelease == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_STABLE=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')

          if [ -n "$LATEST_STABLE" ]; then
            echo "Updating appcast on latest stable release: $LATEST_STABLE"
            gh release delete-asset "$LATEST_STABLE" appcast.xml --yes 2>/dev/null || true
            gh release upload "$LATEST_STABLE" releases/appcast.xml --clobber
            echo "Updated appcast.xml on $LATEST_STABLE"
          else
            echo "No stable release found to update"
          fi

      - name: Summary
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: v${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pre-release**: ${{ needs.prepare-release.outputs.is_prerelease }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Assets" >> "$GITHUB_STEP_SUMMARY"
          ls -la releases/ >> "$GITHUB_STEP_SUMMARY"
