name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0 or 0.5.0-beta-1)'
        required: true
        type: string

env:
  PROJECT_NAME: Sorty
  SCHEME: Sorty

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      # ===========================================
      # 1. Checkout
      # ===========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ===========================================
      # 2. Setup Xcode
      # ===========================================
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable' # Use latest stable Xcode for SDK compatibility

      # ===========================================
      # 2b. Run Unit Tests
      # ===========================================
      - name: Run Unit Tests
        run: |
          swift test --parallel 2>&1 | tail -100

      # ===========================================
      # 3. Extract version from tag or input
      # ===========================================
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          
          # Check if beta
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi
          
          echo "Releasing version: ${VERSION}"

      # ===========================================
      # 3b. Update Changelog
      # ===========================================
      - name: Update Changelog
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Guard: skip if this version already exists in CHANGELOG.md
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md 2>/dev/null; then
            echo "Version ${VERSION} already exists in CHANGELOG.md, skipping"
            exit 0
          fi

          # Get previous tag reliably (second most recent tag by version sort)
          CURRENT_TAG="v${VERSION}"
          PREV_TAG=$(git tag --sort=-v:refno | grep '^v' | while read -r t; do
            if [ "$t" != "$CURRENT_TAG" ]; then
              echo "$t"
              break
            fi
          done)

          # Collect commits since previous tag
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
          else
            # First release — include all commits
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
          fi

          if [ -z "$COMMITS" ]; then
            echo "No commits found, skipping changelog update"
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)

          # Categorize commits by conventional commit prefix
          ADDED=""
          CHANGED=""
          FIXED=""
          REMOVED=""
          OTHER=""

          while IFS= read -r msg; do
            # Strip leading/trailing whitespace
            msg=$(echo "$msg" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$msg" ] && continue

            # Match conventional commit prefixes (case-insensitive)
            lower=$(echo "$msg" | tr '[:upper:]' '[:lower:]')
            # Remove the prefix for the bullet point
            body=$(echo "$msg" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?:[[:space:]]*//')

            case "$lower" in
              feat*)    ADDED="${ADDED}- ${body}"$'\n' ;;
              fix*)     FIXED="${FIXED}- ${body}"$'\n' ;;
              refactor*|perf*|style*) CHANGED="${CHANGED}- ${body}"$'\n' ;;
              revert*)  REMOVED="${REMOVED}- ${body}"$'\n' ;;
              docs*|test*|build*|ci*|chore*) OTHER="${OTHER}- ${body}"$'\n' ;;
              *)        OTHER="${OTHER}- ${msg}"$'\n' ;;
            esac
          done <<< "$COMMITS"

          # Build the changelog entry using a temp file (safe with special chars)
          ENTRY_FILE=$(mktemp)
          echo "## [${VERSION}] - ${DATE}" >> "$ENTRY_FILE"
          echo "" >> "$ENTRY_FILE"

          if [ -n "$ADDED" ]; then
            echo "### Added" >> "$ENTRY_FILE"
            echo "$ADDED" >> "$ENTRY_FILE"
          fi
          if [ -n "$CHANGED" ]; then
            echo "### Changed" >> "$ENTRY_FILE"
            echo "$CHANGED" >> "$ENTRY_FILE"
          fi
          if [ -n "$FIXED" ]; then
            echo "### Fixed" >> "$ENTRY_FILE"
            echo "$FIXED" >> "$ENTRY_FILE"
          fi
          if [ -n "$REMOVED" ]; then
            echo "### Removed" >> "$ENTRY_FILE"
            echo "$REMOVED" >> "$ENTRY_FILE"
          fi
          if [ -n "$OTHER" ]; then
            echo "### Other" >> "$ENTRY_FILE"
            echo "$OTHER" >> "$ENTRY_FILE"
          fi

          # If no categorized commits at all, add a generic entry
          if [ -z "$ADDED" ] && [ -z "$CHANGED" ] && [ -z "$FIXED" ] && [ -z "$REMOVED" ] && [ -z "$OTHER" ]; then
            echo "### Changes" >> "$ENTRY_FILE"
            echo "$COMMITS" | while IFS= read -r line; do
              echo "- ${line}" >> "$ENTRY_FILE"
            done
            echo "" >> "$ENTRY_FILE"
          fi

          # Insert new entry into CHANGELOG.md
          INSERT_LINE=$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1)

          if [ -n "$INSERT_LINE" ]; then
            # Insert before the first version entry
            {
              head -n $((INSERT_LINE - 1)) CHANGELOG.md
              cat "$ENTRY_FILE"
              tail -n +${INSERT_LINE} CHANGELOG.md
            } > CHANGELOG.tmp
          else
            # No existing entries — append after the whole file
            {
              cat CHANGELOG.md
              echo ""
              cat "$ENTRY_FILE"
            } > CHANGELOG.tmp
          fi

          mv CHANGELOG.tmp CHANGELOG.md
          rm -f "$ENTRY_FILE"

          echo "Changelog updated for version ${VERSION}"

      - name: Commit Changelog
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit"
          else
            git commit -m "chore: update changelog for v${{ steps.version.outputs.VERSION }}"
            git push origin HEAD:main
          fi

      # ===========================================
      # 4. Build
      # ===========================================
      - name: Build
        run: |
          chmod +x ./scripts/build.sh
          # Use xcodebuild for CI releases - ensures proper SDK targeting
          # Versioning is handled automatically via git tags in build.sh
          BUILD_METHOD=xcodebuild SKIP_TESTS=true ./scripts/build.sh
      # ===========================================
      # 5. Package (ZIP)
      # ===========================================
      - name: Package
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh


      # ===========================================
      # 8. Generate Appcast with Sparkle signing
      # ===========================================
      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x ./scripts/generate_appcast_ci.sh
          ./scripts/generate_appcast_ci.sh

      # ===========================================
      # 8b. Validate Sparkle Update System
      # ===========================================
      - name: Validate Sparkle Update System
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh

      # ===========================================
      # 9. Create tag (for workflow_dispatch)
      # ===========================================
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="v${{ steps.version.outputs.VERSION }}"
          if ! git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -a "${TAG_NAME}" -m "Release ${{ steps.version.outputs.VERSION }}"
            git push origin "${TAG_NAME}"
          fi
      # ===========================================
      # 10. Create GitHub Release
      # ===========================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: ${{ env.PROJECT_NAME }} ${{ steps.version.outputs.VERSION }}
          files: |
            releases/Sorty.pkg
            releases/appcast.xml
          generate_release_notes: true
          append_body: true
          body: |
            
            ## Installation
            Download `Sorty.pkg` below.
            > ⚠️ **Note**: The app is not signed with an Apple Developer certificate. If macOS blocks the app, run:
            > ```bash
            > xattr -cr /Applications/Sorty.app
            > ```

            ## CLI Tools
            Sorty bundles CLI tools inside the app. Install them from **Settings → Finder Integration → Command Line Tools**.
            
            ## Additional Downloads
            - **Sorty-Source.zip** - Full source code
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE == 'true' }}

      # ===========================================
      # 11. Update latest stable release with merged appcast
      # ===========================================
      - name: Update latest stable appcast
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest stable release tag
          LATEST_STABLE=$(gh release list --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          
          if [ -n "$LATEST_STABLE" ]; then
            echo "Updating appcast on latest stable release: $LATEST_STABLE"
            
            # Delete old appcast from stable release
            gh release delete-asset "$LATEST_STABLE" appcast.xml --yes 2>/dev/null || true
            
            # Upload merged appcast to stable release
            gh release upload "$LATEST_STABLE" releases/appcast.xml --clobber
            
            echo "Updated appcast.xml on $LATEST_STABLE with merged entries"
          else
            echo "No stable release found to update"
          fi
      # ===========================================
      # 12. Summary
      # ===========================================
      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: ${{ steps.version.outputs.IS_PRERELEASE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets" >> $GITHUB_STEP_SUMMARY
          ls -la releases/ >> $GITHUB_STEP_SUMMARY
