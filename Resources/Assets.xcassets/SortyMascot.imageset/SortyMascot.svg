<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background glow -->
  <defs>
    <radialGradient id="headGradient" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#A8E6FF"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </radialGradient>
    <radialGradient id="headHighlight" cx="30%" cy="20%" r="60%" fx="30%" fy="20%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="antennaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Antenna stem -->
  <rect x="30" y="6" width="4" height="10" rx="2" fill="url(#antennaGradient)"/>
  
  <!-- Antenna ball -->
  <circle cx="32" cy="6" r="4" fill="#29B6F6"/>
  <circle cx="31" cy="5" r="1.5" fill="#FFFFFF" fill-opacity="0.6"/>
  
  <!-- Left ear -->
  <circle cx="8" cy="36" r="6" fill="url(#headGradient)" filter="url(#shadow)"/>
  <circle cx="7" cy="35" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <!-- Right ear -->
  <circle cx="56" cy="36" r="6" fill="url(#headGradient)" filter="url(#shadow)"/>
  <circle cx="55" cy="35" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <!-- Robot head - rounded rectangle -->
  <rect x="10" y="18" width="44" height="38" rx="14" fill="url(#headGradient)" filter="url(#shadow)"/>
  
  <!-- Head highlight overlay -->
  <rect x="10" y="18" width="44" height="38" rx="14" fill="url(#headHighlight)"/>
  
  <!-- Left eye socket -->
  <ellipse cx="23" cy="34" rx="7" ry="8" fill="#1A1A2E"/>
  
  <!-- Right eye socket -->
  <ellipse cx="41" cy="34" rx="7" ry="8" fill="#1A1A2E"/>
  
  <!-- Left eye highlight -->
  <circle cx="21" cy="32" r="2.5" fill="#FFFFFF"/>
  <circle cx="25" cy="36" r="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
  
  <!-- Right eye highlight -->
  <circle cx="39" cy="32" r="2.5" fill="#FFFFFF"/>
  <circle cx="43" cy="36" r="1.5" fill="#FFFFFF" fill-opacity="0.5"/>
  
  <!-- Mouth - cute smile -->
  <path d="M25 47 Q32 52 39 47" stroke="#1A1A2E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
