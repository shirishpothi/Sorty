<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script async defer src="https://cdn.affonso.io/js/pixel.min.js" data-affonso="cmor96rxj0006v7gvz38bxzvo" data-cookie_duration="30"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recover License · Droppy</title>
  <meta name="description" content="Recover your Droppy license key via email.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/webp" href="/assets/favicon.webp">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("https://framerusercontent.com/assets/vQyevYAyHtARFwPqUzQGpnDs.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Inter";
      src: url("https://framerusercontent.com/assets/d3tHnaQIAeqiE5hGcRw4mmgWYU.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 500;
    }

    @font-face {
      font-family: "Inter";
      src: url("https://framerusercontent.com/assets/1ZFS7N918ojhhd0nQWdj3jz4w.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 600;
    }

    @font-face {
      font-family: "Inter";
      src: url("https://framerusercontent.com/assets/DXD0Q7LSl7HEvDzucnyLnGBHM.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 700;
    }

    :root {
      --bg: #04070a;
      --text: #f6fbff;
      --muted: rgba(226, 236, 248, 0.84);
      --border: rgba(255, 255, 255, 0.12);
      --danger: #ffb1b1;
      --success: #bee9c8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: radial-gradient(80% 70% at 50% -8%, rgba(129, 180, 241, 0.28) 0%, rgba(4, 7, 10, 0) 55%), var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -ms-overflow-style: none;
      scrollbar-width: none;
      max-width: 100%;
      overflow-x: hidden;
    }

    *::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: clamp(14px, 2vw, 24px);
    }

    .droppy-license-modal {
      position: relative;
      width: min(100%, 980px);
      border-radius: 40px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(94, 94, 94, 0.4) 0%, rgba(40, 40, 40, 0.4) 100%);
      backdrop-filter: blur(60px);
      -webkit-backdrop-filter: blur(60px);
      box-shadow: inset 0px 1px 2px 0px rgba(255, 255, 255, 0.2), 0 30px 70px rgba(0, 0, 0, 0.45);
      padding: clamp(26px, 2.8vw, 44px);
      display: grid;
      gap: 16px;
      transform: translateY(10px) scale(0.985);
      opacity: 0;
      animation: modal-in 0.4s cubic-bezier(0.2, 0.77, 0.24, 0.99) forwards;
    }

    .droppy-license-modal::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0));
      opacity: 0.7;
    }

    @keyframes modal-in {
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .license-title {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(42px, 4.8vw, 72px);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.92;
      color: var(--text);
    }

    .license-meta {
      margin: 0;
      max-width: 780px;
      font-family: "Inter", "Inter Placeholder", sans-serif;
      font-weight: 400;
      font-size: clamp(13px, 1.12vw, 15px);
      line-height: 1.45;
      letter-spacing: -0.005em;
      color: var(--muted);
    }

    .input-wrap {
      display: grid;
      gap: 8px;
      margin-top: 4px;
    }

    .input-label {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: rgba(230, 239, 248, 0.9);
    }

    .field-input {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.16);
      color: var(--text);
      min-height: 54px;
      padding: 0 16px;
      font-size: 16px;
      letter-spacing: 0;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .field-input:focus {
      border-color: rgba(163, 206, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(82, 162, 237, 0.2);
    }

    .status {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--success);
    }

    .status[hidden] {
      display: none;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border-radius: 999px;
      border: 0;
      min-height: 54px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Inter", sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1), filter 0.28s cubic-bezier(0.22, 0.61, 0.36, 1), box-shadow 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05) saturate(1.03);
    }

    .btn:active {
      transform: translateY(0) scale(0.985);
    }

    .btn-primary {
      background: #ffffff;
      color: #101828;
      box-shadow: inset 0px 0px 10px 0px rgba(255, 255, 255, 0.65), 0px 5px 18px 0px rgba(255, 255, 255, 0.12);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #e7edf5;
      box-shadow: inset 0px 1px 1px rgba(255, 255, 255, 0.12);
    }

    .btn:disabled {
      opacity: 0.72;
      cursor: wait;
      pointer-events: none;
    }

    @media (max-width: 809px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .droppy-license-modal {
        border-radius: 24px;
        padding: 20px 16px;
      }

      .actions {
        flex-direction: column;
      }

      .license-meta {
        font-size: 14px;
      }

      .btn {
        min-height: 50px;
        font-size: 15px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="droppy-license-modal" role="main" aria-labelledby="license-title">
    <h1 id="license-title" class="license-title">Recover your license</h1>
    <p class="license-meta">Enter the email address you used when purchasing Droppy. You can <strong style="color:#f6fbff;">recover</strong> your existing key(s) via email, or <strong style="color:#f6fbff;">reset</strong> your license to get a brand new key (your old key will be revoked).</p>

    <div class="input-wrap">
      <p class="input-label">Purchase email</p>
      <input id="email-input" class="field-input" type="email" autocomplete="email" spellcheck="false" placeholder="you@example.com">
    </div>

    <p id="status" class="status" aria-live="polite" hidden></p>

    <div class="actions">
      <button id="recover" class="btn btn-primary" type="button">Send Recovery Email</button>
      <button id="reset" class="btn btn-secondary" type="button">Reset License Key</button>
      <a class='btn btn-secondary' href='/'>Back to Home</a>
    </div>
  </main>

  <script src="assets/js/license-flow-config.js"></script>
  <script>
    const statusNode = document.getElementById("status");
    const recoverButton = document.getElementById("recover");
    const resetButton = document.getElementById("reset");
    const emailInput = document.getElementById("email-input");

    const config = window.DROPPY_LICENSE_FLOW_CONFIG || {};
    const functionsBaseURL = config.FUNCTIONS_BASE_URL || "";
    const recoverURL = functionsBaseURL ? `${functionsBaseURL}/license-recover` : "";
    const resetRequestURL = functionsBaseURL ? `${functionsBaseURL}/license-reset-request` : "";

    function showStatus(message, kind) {
      statusNode.hidden = false;
      statusNode.textContent = message;
      statusNode.classList.remove("error", "success");
      statusNode.classList.add(kind === "error" ? "error" : "success");
    }

    if (!recoverURL) {
      recoverButton.disabled = true;
      showStatus("Recovery endpoint is not configured.", "error");
    }

    if (!resetRequestURL) {
      resetButton.disabled = true;
    }

    emailInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !recoverButton.disabled) {
        recoverButton.click();
      }
    });

    recoverButton.addEventListener("click", async () => {
      const email = (emailInput.value || "").trim().toLowerCase();
      if (!email || !email.includes("@")) {
        showStatus("Please enter a valid email address.", "error");
        return;
      }

      recoverButton.disabled = true;
      showStatus("Sending recovery email...", "success");

      try {
        const response = await fetch(recoverURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          showStatus(payload.error || "Something went wrong. Please try again.", "error");
          recoverButton.disabled = false;
          return;
        }

        showStatus(
          payload.message || "If a license exists for this email, we've sent you the details. Check your inbox and spam folder.",
          "success"
        );

        // Keep button disabled for 30 seconds to prevent spam.
        setTimeout(() => {
          recoverButton.disabled = false;
        }, 30000);
      } catch (_) {
        showStatus("Network error. Please check your connection and try again.", "error");
        recoverButton.disabled = false;
      }
    });

    resetButton.addEventListener("click", async () => {
      const email = (emailInput.value || "").trim().toLowerCase();
      if (!email || !email.includes("@")) {
        showStatus("Please enter a valid email address.", "error");
        return;
      }

      resetButton.disabled = true;
      recoverButton.disabled = true;
      showStatus("Sending reset confirmation email...", "success");

      try {
        const response = await fetch(resetRequestURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });

        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          showStatus(payload.error || "Something went wrong. Please try again.", "error");
          resetButton.disabled = false;
          recoverButton.disabled = false;
          return;
        }

        showStatus(
          payload.message || "If a license exists for this email, we've sent a confirmation link. Check your inbox and spam folder.",
          "success"
        );

        // Keep buttons disabled for 30 seconds to prevent spam.
        setTimeout(() => {
          resetButton.disabled = false;
          recoverButton.disabled = false;
        }, 30000);
      } catch (_) {
        showStatus("Network error. Please check your connection and try again.", "error");
        resetButton.disabled = false;
        recoverButton.disabled = false;
      }
    });
  </script>
</body>
</html>
