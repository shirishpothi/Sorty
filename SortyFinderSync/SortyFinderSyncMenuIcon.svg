<svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna ball with ring detail -->
  <circle cx="11" cy="1.6" r="1.6" fill="black"/>
  <circle cx="11" cy="1.6" r="0.7" fill="white"/>

  <!-- Antenna stem -->
  <path d="M11 3.2 L11 5.5" stroke="black" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left ear with inner detail -->
  <circle cx="2.2" cy="12" r="2" fill="black"/>
  <circle cx="2.2" cy="12" r="0.8" fill="white"/>

  <!-- Right ear with inner detail -->
  <circle cx="19.8" cy="12" r="2" fill="black"/>
  <circle cx="19.8" cy="12" r="0.8" fill="white"/>

  <!-- Robot head - rounded rect -->
  <rect x="3.5" y="5.5" width="15" height="13" rx="5" fill="black"/>

  <!-- Visor band across eyes -->
  <rect x="5.5" y="9" width="11" height="5" rx="2.5" fill="white" fill-opacity="0.25"/>

  <!-- Left eye -->
  <circle cx="8.2" cy="11.5" r="2" fill="white"/>
  <!-- Left pupil -->
  <circle cx="8.6" cy="11.3" r="0.8" fill="black"/>

  <!-- Right eye -->
  <circle cx="13.8" cy="11.5" r="2" fill="white"/>
  <!-- Right pupil -->
  <circle cx="14.2" cy="11.3" r="0.8" fill="black"/>

  <!-- Nose dot -->
  <circle cx="11" cy="14" r="0.6" fill="white" fill-opacity="0.5"/>

  <!-- Smile -->
  <path d="M8.5 15.5 Q11 17.2 13.5 15.5" stroke="white" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Forehead bolt left -->
  <circle cx="6.5" cy="7.5" r="0.6" fill="white" fill-opacity="0.35"/>

  <!-- Forehead bolt right -->
  <circle cx="15.5" cy="7.5" r="0.6" fill="white" fill-opacity="0.35"/>

  <!-- Chin plate line -->
  <path d="M7.5 17 L14.5 17" stroke="white" stroke-width="0.5" stroke-opacity="0.3" stroke-linecap="round"/>
</svg>
