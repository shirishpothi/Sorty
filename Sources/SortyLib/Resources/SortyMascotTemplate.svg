<svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head - pill shaped with smoother curves -->
  <rect x="3" y="6" width="16" height="13" rx="5.5" fill="black"/>
  
  <!-- Antenna stem - slightly curved -->
  <path d="M10.5 6 Q10.5 4 11 2" stroke="black" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Antenna ball - slightly larger -->
  <circle cx="11" cy="1.8" r="1.8" fill="black"/>
  
  <!-- Left ear -->
  <circle cx="2" cy="12.5" r="2.2" fill="black"/>
  
  <!-- Right ear -->
  <circle cx="20" cy="12.5" r="2.2" fill="black"/>
  
  <!-- Left eye - slightly larger -->
  <circle cx="8" cy="11.5" r="2.3" fill="white"/>
  
  <!-- Right eye - slightly larger -->
  <circle cx="14" cy="11.5" r="2.3" fill="white"/>
  
  <!-- Smile - simpler curve that renders well at small sizes -->
  <path d="M8 15.5 Q11 17.5 14 15.5" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>